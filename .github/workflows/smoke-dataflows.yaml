name: Smoke Dataflows

on:
  workflow_call:

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dataset-viz
            command: just pipeline run --profile cicd_profile
          - name: vio
            command: just pipeline run --profile slam_agent_profile --dataset euroc_smoke --dataflow vio-dataflow.yml --fraction 1
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Use Just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify native imports
        run: uv run --no-sync python -c "import gtsam; print('gtsam ok', gtsam.__file__)"

      - name: Run smoke dataflow
        timeout-minutes: 5
        run: |
          just logs clear
          ${{ matrix.command }}

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-dataflow-${{ matrix.name }}-logs
          path: |
            pipeline/out/current-run.json
            pipeline/out/latest/**
          if-no-files-found: ignore
