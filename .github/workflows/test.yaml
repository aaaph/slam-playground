name: Test

on:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      UV_CACHE_DIR: /tmp/.uv-cache
      PYDBOW3_WHEEL_DIR: dist/pydbow3-wheel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Use Just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download PyDBoW3 wheel
        uses: actions/download-artifact@v8
        with:
          name: pydbow3-wheel
          path: ${{ env.PYDBOW3_WHEEL_DIR }}

      - name: Install PyDBoW3 wheel
        run: uv pip install --no-deps "${PYDBOW3_WHEEL_DIR}"/*x86_64.whl

      - name: Verify native imports
        run: |
          uv run --no-sync python -c "import gtsam; print('gtsam ok', gtsam.__file__)"
          uv run --no-sync python -c "import gtsam_unstable; print('gtsam_unstable ok', gtsam_unstable.__file__)"
          uv run --no-sync python -c "import pydbow3; print('pydbow3 ok', pydbow3.__file__)"

      - name: Static checks
        run: |
          uv run --no-sync ty check
          uv run --no-sync ruff check .

      - name: Unit Tests
        run: uv run --no-sync pytest --verbose --color=yes src

      - name: Smoke Tests
        run: uv run pytest -m smoke tests/smoke -vv

      - name: Smoke syntetic EuRoc
        timeout-minutes: 5
        run: |
          just logs clear
          just pipeline run --profile cicd_profile
