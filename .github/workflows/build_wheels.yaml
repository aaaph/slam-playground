name: Build Wheels

on:
  workflow_call:

jobs:
  build_pydbow3_wheel:
    runs-on: ubuntu-24.04
    env:
      PYDBOW3_WHEEL_DIR: dist/pydbow3-wheel
      PYDBOW3_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: extractions/setup-just@v4

      - name: Restore PyDBoW3 wheel cache
        id: pydbow3-wheel-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PYDBOW3_WHEEL_DIR }}
          key: pydbow3-wheel-linux-amd64-python-3.13-${{ hashFiles('scripts/docker/pydbow3-wheel.Dockerfile', 'scripts/build_pydbow3_wheel_docker.sh') }}

      - name: Build PyDBoW3 wheel
        if: ${{ steps.pydbow3-wheel-cache.outputs.cache-hit != 'true' }}
        run: |
          PYDBOW3_BUILD_JOBS=4 OUT_DIR="${PYDBOW3_WHEEL_DIR}" PLATFORM="${PYDBOW3_PLATFORM}" \
            bash scripts/build_pydbow3_wheel_docker.sh

      - name: Upload PyDBoW3 wheel
        uses: actions/upload-artifact@v7
        with:
          name: pydbow3-wheel
          path: ${{ env.PYDBOW3_WHEEL_DIR }}/*.whl
          if-no-files-found: error
