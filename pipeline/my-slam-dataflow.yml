nodes:
  - id: control
    path: ../src/pipeline_nodes/zenoh_control_node.py
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - start_dataset
      - pause_dataset
      - next_item_dataset
    env:
      LOG_LEVEL: INFO

  - id: dataset
    path: ../src/pipeline_nodes/dataset_node.py
    inputs:
      control_start: control/start_dataset
      control_pause: control/pause_dataset
      control_step: control/next_item_dataset
      tick: dora/timer/millis/50
    outputs:
      - ctx
    env:
      INITIAL_STATE: IDLE
      LOG_LEVEL: TRACE

  - id: front-end
    path: ../src/pipeline_nodes/stereo_front_end_node.py
    inputs:
      ctx: dataset/ctx
      helthcheck: dora/timer/millis/1000
    outputs:
      - ctx
    env:
      LOG_LEVEL: INFO

  - id: back-end
    path: ../src/pipeline_nodes/sliding_window_back_end_node.py
    inputs:
      ctx: front-end/ctx
      helthcheck: dora/timer/millis/1000
    outputs:
      - ctx
    env:
      LOG_LEVEL: INFO

  - id: rerun
    path: ../src/pipeline_nodes/rerun_node.py
    inputs:
      ctx: back-end/ctx
      helthcheck: dora/timer/millis/1000
    env:
      LOG_LEVEL: INFO
