nodes:
  - id: control
    path: ../src/pipeline/nodes/zenoh_control_node.py
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - ds
    env:
      LOG_LEVEL: INFO

  - id: dataset
    path: ../src/pipeline/nodes/dataset_node.py
    inputs:
      control: control/ds
      tick: dora/timer/millis/50
    outputs:
      - ctx
    env:
      INITIAL_STATE: IDLE
      LOG_LEVEL: TRACE

  - id: tracker
    path: ../src/pipeline/nodes/feature_tracker_node.py
    inputs:
      ctx: dataset/ctx
    outputs:
      - ctx
    env:
      LOG_LEVEL: DEBUG

  - id: rerun
    path: ../src/pipeline/nodes/rerun_node.py
    inputs:
      ctx: tracker/ctx
      helthcheck: dora/timer/millis/1000
    env:
      LOG_LEVEL: INFO
      VISUALIZE_IMAGE_STREAMS: '{"left_rect": "/world/odom/base_link/cam0/rect"}'
      VISUALIZE_FEATURES_STREAMS: '{"active_feat": "/world/odom/base_link/cam0/rect/features"}'
