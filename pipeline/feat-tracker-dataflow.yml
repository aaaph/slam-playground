nodes:
  - id: control
    path: ../src/pipeline/nodes/zenoh_control_node.py
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - ds
    env:
      LOG_LEVEL: TRACE

  - id: dataset
    path: ../src/pipeline/nodes/dataset_node.py
    inputs:
      control: control/ds
      tick: dora/timer/millis/20
    outputs:
      - sensor_frame
    env:
      INITIAL_STATE: IDLE
      LOG_LEVEL: TRACE

  - id: tracker
    path: ../src/pipeline/nodes/feature_tracker_node.py
    inputs:
      sensor_frame:
        source: dataset/sensor_frame
        queue_size: 20
      helthcheck: dora/timer/millis/1000
    outputs:
      - tracker_frame
    env:
      LOG_LEVEL: DEBUG

  - id: rerun
    path: ../src/pipeline/nodes/rerun_node.py
    inputs:
      dataset_frame: dataset/sensor_frame
      tracker_frame: tracker/tracker_frame
      helthcheck: dora/timer/millis/1000
    env:
      LOG_LEVEL: INFO
      VISUALIZE_CONFIG: ../config/visualization/tracker_view_config.yaml
