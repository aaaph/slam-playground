nodes:
  - id: control
    path: ../src/pipeline/nodes/zenoh_control_node.py
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - ds
    env:
      LOG_LEVEL: INFO

  - id: dataset
    path: ../src/pipeline/nodes/dataset_node.py
    inputs:
      control: control/ds
      tick: dora/timer/millis/20
    outputs:
      - sensor_frame
    env:
      INITIAL_STATE: IDLE
      LOG_LEVEL: TRACE

  - id: frontend
    path: ../src/pipeline/nodes/vio_frontend.py
    inputs:
      sensor_frame:
        source: dataset/sensor_frame
        queue_size: 20
      helthcheck: dora/timer/millis/1000
    outputs:
      - frame
      - keyframes
    env:
      LOG_LEVEL: DEBUG

  - id: rerun
    path: ../src/pipeline/nodes/rerun_node.py
    inputs:
      dataset_frame: dataset/sensor_frame
      frontend_frame: frontend/frame
      helthcheck: dora/timer/millis/1000
    env:
      LOG_LEVEL: INFO
      VISUALIZE_CONFIG: ../config/visualization/front_end_only_view_config.yaml
