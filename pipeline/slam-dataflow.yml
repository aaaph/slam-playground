nodes:
  - id: control
    name: "Control Node"
    path: ../src/pipeline/nodes/control_node.py
    description: "Control Node"
    inputs:
      transport_tick: dora/timer/millis/20
    outputs:
      - ds
    env:
      LOG_LEVEL: INFO

  - id: dataset
    path: ../src/pipeline/nodes/dataset_node.py
    name: "Dataset"
    inputs:
      control: control/ds
      tick: dora/timer/millis/20
      helthcheck: dora/timer/millis/1000
    outputs:
      - sensor_frame
    env:
      INITIAL_STATE: IDLE
      LOG_LEVEL: INFO

  - id: frontend
    path: ../src/pipeline/nodes/vio_frontend.py
    name: "Front-End"
    inputs:
      sensor_frame:
        source: dataset/sensor_frame
        queue_size: 50
      feedback: fixed_lag/feedback
      helthcheck: dora/timer/millis/1000
    outputs:
      - frame
      - keyframes
    env:
      LOG_LEVEL: DEBUG

  - id: fixed_lag
    path: ../src/pipeline/nodes/smart_factor_smoother.py
    name: "Fixed-Lag"
    inputs:
      keyframes:
        source: frontend/keyframes
        queue_size: 20
      helthcheck: dora/timer/millis/1000
    outputs:
      - feedback
      - frame
    env:
      LOG_LEVEL: DEBUG

  - id: loop_closure
    name: "Loop Closure Detection"
    path: ../src/pipeline/nodes/loop_closure_detection.py
    inputs:
      keyframes:
        source: frontend/keyframes
        queue_size: 20
      helthcheck: dora/timer/millis/1000
    outputs:
      - detected_loop
      - visualization
    env:
      LOG_LEVEL: DEBUG
      VOCABULARY_PATH: ../artifacts/orb_vocabulary/ORBvoc.dbow3

  - id: pgo
    name: "Pose Graph Optimization"
    path: ../src/pipeline/nodes/pose_graph_smoother.py
    inputs:
      fixedlag_frame: fixed_lag/frame
      detected_loop: loop_closure/detected_loop
      reconcile_tick: dora/timer/millis/50
      helthcheck: dora/timer/millis/1000
    outputs:
      - visualization
      - pgo_frame
    env:
      LOG_LEVEL: DEBUG

  #- id: mapping
  #  name: "SLAM Dense Mapping"
  #  path: ../src/pipeline/nodes/mapping.py
  #  inputs:
  #    keyframes: frontend/keyframes
  # outputs:
  #   - frame
  #  env:
  #    LOG_LEVEL: DEBUG#

  - id: slam_output
    name: "SLAM Output Node"
    path: ../src/pipeline/nodes/slam_output_aggregator.py
    inputs:
      frontend_frame: frontend/frame
      pgo_frame: pgo/pgo_frame
      helthcheck: dora/timer/millis/1000
    outputs:
      - slam_frame
    env:
      LOG_LEVEL: INFO

  - id: trajectory_evaluator
    name: "Trajectory Evaluator"
    path: ../src/pipeline/nodes/trajectory_evaluator.py
    inputs:
      slam_frame: slam_output/slam_frame
      helthcheck: dora/timer/millis/1000
    outputs:
      - visualization
    env:
      LOG_LEVEL: INFO

  - id: rerun
    name: "Rerun"
    path: ../src/pipeline/nodes/rerun_node.py
    inputs:
      dataset_frame: dataset/sensor_frame
      frontend_frame:
        source: frontend/frame
        queue_size: 20
      fixedlag_frame: fixed_lag/frame
      loopclosure_frame: loop_closure/visualization
      pgo_frame: pgo/visualization
      # mapping_frame: mapping/frame
      slam_frame: slam_output/slam_frame
      trajectory_evaluator_frame: trajectory_evaluator/visualization
      helthcheck: dora/timer/millis/1000
    env:
      LOG_LEVEL: INFO
      VISUALIZE_CONFIG: ../config/visualization/slam_view_config.yaml
