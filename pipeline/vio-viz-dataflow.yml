nodes:
  - id: control
    path: ../src/pipeline_nodes/zenoh_control_node.py
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - ds
    env:
      LOG_LEVEL: INFO

  - id: dataset
    path: ../src/pipeline_nodes/dataset_node.py
    inputs:
      control: control/ds
      tick: dora/timer/millis/33
    outputs:
      - ctx
    env:
      INITIAL_STATE: IDLE
      LOG_LEVEL: TRACE

  - id: rerun
    path: ../src/pipeline_nodes/rerun_node.py
    inputs:
      ctx: dataset/ctx
      helthcheck: dora/timer/millis/1000
    env:
      LOG_LEVEL: INFO
      VISUALIZE_IMAGE_STREAMS: '{"left": "/world/odom/base_link/cam0"}'
      VISUALIZE_IMU_STREAM: '{"entity_path": "/world/odom/base_link/imu", "fields": ["gyro", "accel"]}'
