nodes:
  - id: control
    path: ../src/pipeline/nodes/zenoh_control_node.py
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - ds
    env:
      LOG_LEVEL: INFO

  - id: dataset
    path: ../src/pipeline/nodes/dataset_node.py
    inputs:
      control: control/ds
      tick: dora/timer/millis/20
    outputs:
      - ctx
    env:
      INITIAL_STATE: IDLE
      LOG_LEVEL: TRACE

  - id: frontend
    path: ../src/pipeline/nodes/vio_frontend.py
    inputs:
      ctx:
        source: dataset/ctx
        queue_size: 10
      feedback: backend/feedback
    outputs:
      - ctx
    env:
      LOG_LEVEL: DEBUG

  - id: backend
    path: ../src/pipeline/nodes/vio_backend.py
    inputs:
      ctx: frontend/ctx
    outputs:
      - ctx
      - feedback
    env:
      LOG_LEVEL: DEBUG

  - id: rerun
    path: ../src/pipeline/nodes/rerun_node.py
    inputs:
      ctx:
        source: backend/ctx
        queue_size: 10
      helthcheck: dora/timer/millis/1000
    env:
      LOG_LEVEL: INFO
      VISUALIZE_CONFIG: ../config/rerun_view_config.yaml
