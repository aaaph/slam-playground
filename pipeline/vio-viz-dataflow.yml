nodes:
  - id: control
    path: ../src/pipeline/nodes/zenoh_control_node.py
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - ds
    env:
      LOG_LEVEL: INFO

  - id: dataset
    path: ../src/pipeline/nodes/dataset_node.py
    inputs:
      control: control/ds
      tick: dora/timer/millis/20
    outputs:
      - ctx
    env:
      INITIAL_STATE: IDLE
      LOG_LEVEL: TRACE

  - id: frontend
    path: ../src/pipeline/nodes/vio_frontend.py
    inputs:
      ctx:
        source: dataset/ctx
        queue_size: 5
      feedback: fixed_lag_smoother/feedback
    outputs:
      - ctx
    env:
      LOG_LEVEL: DEBUG

  - id: fixed_lag_smoother
    path: ../src/pipeline/nodes/fixed_lag_smoother.py
    inputs:
      ctx:
        source: frontend/ctx
        queue_size: 5
    outputs:
      - ctx
      - feedback
    env:
      LOG_LEVEL: DEBUG

  - id: vpr
    path: ../src/pipeline/nodes/place_recognition.py
    inputs:
      ctx:
        source: fixed_lag_smoother/ctx
        queue_size: 5
    outputs:
      - ctx
    env:
      LOG_LEVEL: DEBUG
      VOCABULARY_PATH: ../vocabulary/ORBvoc.dbow3

  - id: rerun
    path: ../src/pipeline/nodes/rerun_node.py
    inputs:
      ctx:
        source: vpr/ctx
        queue_size: 5
      helthcheck: dora/timer/millis/1000
    env:
      LOG_LEVEL: INFO
      VISUALIZE_CONFIG: ../config/rerun_view_config.yaml
