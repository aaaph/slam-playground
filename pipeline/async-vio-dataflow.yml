nodes:
  - id: control
    path: ../src/pipeline/nodes/zenoh_control_node.py
    inputs:
      tick: dora/timer/millis/20
    outputs:
      - ds
    env:
      LOG_LEVEL: INFO

  - id: dataset
    path: ../src/pipeline/nodes/dataset_node.py
    inputs:
      control: control/ds
      tick: dora/timer/millis/20
      helthcheck: dora/timer/millis/1000
    outputs:
      - sensor_frame
    env:
      INITIAL_STATE: IDLE
      LOG_LEVEL: TRACE

  - id: frontend
    path: ../src/pipeline/nodes/vio_frontend.py
    inputs:
      sensor_frame: dataset/sensor_frame
      feedback: fixed_lag_smoother/feedback
      helthcheck: dora/timer/millis/1000
    outputs:
      - frame
      - keyframes
    env:
      LOG_LEVEL: DEBUG

  - id: fixed_lag_smoother
    path: ../src/pipeline/nodes/fixed_lag_smoother.py
    inputs:
      keyframes: frontend/keyframes
      helthcheck: dora/timer/millis/1000
    outputs:
      - feedback
      - frame
    env:
      LOG_LEVEL: DEBUG

  - id: rerun
    path: ../src/pipeline/nodes/rerun_node.py
    inputs:
      dataset_frame: dataset/sensor_frame
      frontend_frame: frontend/frame
      fixedlag_frame: fixed_lag_smoother/frame
      helthcheck: dora/timer/millis/1000
    env:
      LOG_LEVEL: INFO
      VISUALIZE_CONFIG: ../config/rerun_view_config.yaml
