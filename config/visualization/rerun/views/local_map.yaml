views:
  - name: "Local Map"
    type: "Spatial3D"
    origin: "/world/estimates/local_map"
    streams:
      - id: "pose_estimate"
        module: "dynamic_transform"
        branch: "frontend_frame"
        entity: "world/estimates/local_map/selected/base_link"
        options:
          show_axes: true
      - id: "cam0_in_body"
        module: "static_transform"
        branch: "frontend_frame"
        entity: "world/estimates/local_map/selected/base_link/cam0"
        options:
          show_axes: true
      - id: "stereo_points"
        module: "pointcloud"
        branch: "frontend_frame"
        entity: "world/estimates/local_map/selected/base_link/cam0/landmarks"
        options:
          points_size_prop_name: stereo_points_size
      - id: "initialized_landmarks"
        module: "pointcloud"
        branch: "frontend_frame"
        entity: "world/estimates/local_map/selected/base_link/cam0/ray_landmarks"
        options:
          points_size_prop_name: initialized_landmarks_size
          default_color: [255, 80, 220]
      - id: "local_map_points"
        module: "pointcloud"
        branch: "frontend_frame"
        entity: "world/estimates/local_map/map/landmarks"
        options:
          points_size_prop_name: local_map_points_size
          visualize_covariance: true
          covariance_color: [80, 220, 255]
      - id: "optimized_pose"
        module: "dynamic_transform"
        branch: "fixedlag_frame"
        entity: "world/estimates/local_map/factor_graph/base_link"
        options:
          show_axes: true
      - id: "cam0_in_body"
        module: "static_transform"
        branch: "fixedlag_frame"
        entity: "world/estimates/local_map/factor_graph/base_link/cam0"
        options:
          show_axes: true
      - id: "optimized_points"
        module: "pointcloud"
        branch: "fixedlag_frame"
        entity: "world/estimates/local_map/factor_graph/map/landmarks"
        options:
          points_size_prop_name: optimized_points_size
      - id: "pose_estimate"
        module: "dynamic_transform"
        branch: "mapping_frame"
        entity: "world/estimates/local_map/mapping/base_link"
        options:
          show_axes: true
      - id: "cam0_in_body"
        module: "static_transform"
        branch: "mapping_frame"
        entity: "world/estimates/local_map/mapping/base_link/cam0"
        options:
          show_axes: true
      - id: "points_in_odom"
        module: "pointcloud"
        branch: "mapping_frame"
        entity: "world/estimates/local_map/mapping/depth_points"
        options:
          points_size_prop_name: points_in_odom_size
          position_columns: [0, 1, 2]
          id_column: null
          show_labels: false
          default_color: [255, 220, 40]
          radii: 0.01
      - id: "mapping_voxels"
        module: "voxel_visualize"
        branch: "mapping_frame"
        entity: "world/estimates/local_map/mapping/voxels/raw"
        options:
          points_size_prop_name: mapping_voxels_size
          draw_mode: points
          point_radius: 0.025
          label_prefix: voxel
      - id: "mapping_confirmed_voxels"
        module: "voxel_visualize"
        branch: "mapping_frame"
        entity: "world/estimates/local_map/mapping/voxels/confirmed"
        options:
          points_size_prop_name: mapping_confirmed_voxels_size
          draw_mode: boxes
          voxel_size_m: 0.1
          box_edge_radius: 0.0025
          fill_mode: solid
          label_prefix: obstacle
