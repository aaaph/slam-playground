[project]
name = "vins-rnd"
version = "0.1.0"
description = "Research and Development of Visual Inertial Navigation Systems"
readme = "README.md"
authors = [{ name = "Ivan Aphanasyev", email = "nekaktotak2@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.1.1",
    "dora-rs>=0.3.12",
    "foxglove-sdk>=0.14.2",
    "jax>=0.7.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "opencv-contrib-python>=4.12.0.88",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.2",
    "pyyaml>=6.0.2",
    "scipy>=1.15.3",
]

[project.scripts]
vins-rnd = "vins_rnd:main"
dataset = "dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "pytest-watcher>=0.4.3",
    "ruff",
    "ty>=0.0.1a21",
]


[tool.pytest-watcher]
now = false
clear = true
delay = 0.2
runner = "pytest"
runner_args = []
patterns = ["test_*.py"]
ignore_patterns = []
