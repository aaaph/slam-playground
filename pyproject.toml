[project]
name = "vins-rnd"
version = "0.1.0"
description = "Research and Development of Visual Inertial Navigation Systems"
readme = "README.md"
authors = [{ name = "Ivan Aphanasyev", email = "nekaktotak2@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "numpy>=2.2.6",
    "pyyaml>=6.0.2",
    "scipy>=1.15.3",
]

[project.scripts]
vins-rnd = "vins_rnd:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
 "pytest>=8.4.2",
 "ruff",
 "ty>=0.0.1a21",
]
