[project]
name = "vins-rnd"
version = "0.1.0"
description = "Research and Development of Visual Inertial Navigation Systems"
readme = "README.md"
authors = [{ name = "Ivan Aphanasyev", email = "nekaktotak2@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "anytree>=2.13.0",
    "datasets>=4.1.1",
    "dora-rs==0.4.1",
    "eclipse-zenoh>=1.7.2",
    "foxglove-sdk>=0.14.2",
    "graphviz>=0.21",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "numpy>=1.11.0",
    "opencv-contrib-python>=4.12.0.88",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.2",
    "plotly>=6.5.0",
    "pyarrow==23.0",
    "pybind11-stubgen>=2.5.1",
    "pydantic>=2.12.5",
    "pyparsing>=3.2.5",
    "pyyaml>=6.0.2",
    "reactivex>=4.1.0",
    "rerun-sdk>=0.28.1",
    "scipy>=1.15.3",
    "typer>=0.21.1",
]

[project.scripts]
vins-rnd = "vins_rnd:main"
dataset = "dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/vins_rnd",
    "src/core",
    "src/dataset",
    "src/logger",
    "src/visualizer",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/**",
    "pipeline/**",
    "tests/**",
    "examples/**",
    "README.md",
    "pyproject.toml",
    "ruff.toml",
    "ty.toml",
    "justfile",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.17",
    "evo>=1.34.0",
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "pytest-watcher>=0.4.3",
    "rerun-sdk>=0.28.1",
    "ruff",
    "ty>=0.0.1a21",
    "zenoh-cli>=0.7.0",
]


[tool.pytest-watcher]
now = false
clear = true
delay = 0.2
runner = "pytest"
runner_args = []
patterns = ["test_*.py"]
ignore_patterns = []

[tool.pytest.ini_options]
testpaths = ["pipeline", "src", "tests"]
markers = ["regression: dataset-based regression tests (slow)"]
log_cli = true
log_cli_level = "INFO"
